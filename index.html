<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Grounded Inspiration Generator</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the Inter font and main background */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        /* Custom spinner animation */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #10b981; /* Emerald green */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 space-y-6">
        <h1 class="text-3xl font-bold text-gray-800 text-center">
            AI Inspiration Generator
        </h1>
        <p class="text-center text-gray-500">
            Enter a topic (e.g., *success*, *technology*, *creativity*) and get a unique, inspiring quote, grounded by Google Search.
        </p>

        <!-- Input and Button Area -->
        <div class="flex flex-col sm:flex-row gap-3">
            <input
                type="text"
                id="topicInput"
                placeholder="Enter a topic for inspiration..."
                class="flex-1 p-3 border-2 border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 transition duration-150"
            >
            <button
                id="generateButton"
                onclick="generateQuote()"
                class="px-6 py-3 bg-emerald-600 text-white font-semibold rounded-lg shadow-md hover:bg-emerald-700 transition duration-150 transform hover:scale-[1.01] disabled:opacity-50 flex items-center justify-center"
            >
                Generate Quote
            </button>
        </div>

        <!-- Quote Display Area -->
        <div id="resultContainer" class="min-h-[150px] mt-8 p-6 bg-emerald-50 border-l-4 border-emerald-600 rounded-lg transition-all duration-300 flex items-center justify-center">
            <p id="quoteOutput" class="text-xl italic text-gray-700 text-center">
                Your quote will appear here.
            </p>
            <div id="loadingIndicator" class="hidden spinner"></div>
        </div>

        <!-- Citation/Source Area -->
        <div id="sourcesContainer" class="text-sm text-gray-500 pt-2 border-t border-gray-100 hidden">
            <p class="font-medium mb-1">Sources Used:</p>
            <ul id="sourcesList" class="list-disc list-inside space-y-1">
                <!-- Sources will be dynamically inserted here -->
            </ul>
        </div>
    </div>

    <script type="module">
        // Global variables for the API and model
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // DOM Elements
        const topicInput = document.getElementById('topicInput');
        const generateButton = document.getElementById('generateButton');
        const quoteOutput = document.getElementById('quoteOutput');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const sourcesContainer = document.getElementById('sourcesContainer');
        const sourcesList = document.getElementById('sourcesList');

        // Function to simulate exponential backoff for API calls
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status !== 429) { // Not a rate limit error
                        return response;
                    }
                    // Rate limit hit (429), wait and retry
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                } catch (error) {
                    if (i === maxRetries - 1) throw error; // Throw error after last attempt
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error('API request failed after multiple retries.');
        }

        /**
         * Generates an inspiring quote based on the user's topic using the Gemini API
         * with Google Search grounding.
         */
        window.generateQuote = async function() {
            const topic = topicInput.value.trim();
            if (!topic) {
                quoteOutput.textContent = 'Please enter a topic before generating a quote!';
                return;
            }

            // 1. Set UI to Loading State
            generateButton.disabled = true;
            quoteOutput.textContent = '';
            loadingIndicator.classList.remove('hidden');
            resultContainer.classList.remove('justify-center');
            sourcesContainer.classList.add('hidden');
            sourcesList.innerHTML = '';
            
            // 2. Define the LLM instructions and payload
            const systemPrompt = `You are a wise, inspiring, and concise philosopher. When given a keyword, your sole task is to generate a single, powerful, and deeply insightful quote relevant to that topic. Do not include introductory phrases, quotation marks, or the author's name in the final response text. The response must be only the quote itself.`;

            const userQuery = `Generate an inspiring quote about the topic: ${topic}.`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                // Enable Google Search grounding to ensure the quote is factual/grounded
                tools: [{ "google_search": {} }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            try {
                // 3. Make the API Call with backoff for robustness
                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    let sources = [];

                    // 4. Extract generated text and citation sources
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri && source.title);
                    }

                    // 5. Update UI with results
                    quoteOutput.textContent = text;
                    if (sources.length > 0) {
                        sourcesContainer.classList.remove('hidden');
                        sources.forEach((source, index) => {
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = source.uri;
                            a.target = "_blank";
                            a.rel = "noopener noreferrer";
                            a.className = "text-emerald-600 hover:text-emerald-800 hover:underline";
                            a.textContent = source.title;
                            li.appendChild(a);
                            sourcesList.appendChild(li);
                        });
                    }
                } else {
                    quoteOutput.textContent = 'Could not generate a quote. Please try a different topic.';
                    console.error('API response error:', result);
                }

            } catch (error) {
                quoteOutput.textContent = 'An error occurred while fetching the quote. Check the console for details.';
                console.error('Fetch error:', error);
            } finally {
                // 6. Reset UI State
                loadingIndicator.classList.add('hidden');
                generateButton.disabled = false;
                resultContainer.classList.add('justify-center');
            }
        }
    </script>
</body>
</html>
